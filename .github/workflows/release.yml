# Release flow:
#   publish a pre-release vX.Y.Z  -> scenario PRs in antidiffamine-test run against @vX.Y.Z
#   promote it to a full release  -> major tag vX moves to it, so users on @vX get it
# Publishing a full release directly does both.
#
# Needs secret TEST_REPO_TOKEN: a fine-grained token for antidiffamine/antidiffamine-test
# with Contents: read and write (to send repository_dispatch).
name: Release

on:
  release:
    # "published" fires for pre-releases and full releases; "released" fires for
    # full releases, including a pre-release being promoted.
    types: [published, released]

jobs:
  scenario-tests:
    if: github.event.action == 'published'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger scenario PRs in antidiffamine-test
        env:
          GH_TOKEN: ${{ secrets.TEST_REPO_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/antidiffamine/antidiffamine-test/dispatches \
            -d "{\"event_type\":\"action-released\",\"client_payload\":{\"version\":\"$TAG\"}}"
          echo "Testing $TAG — results: https://github.com/antidiffamine/antidiffamine-test/actions/workflows/release-test.yml" >> "$GITHUB_STEP_SUMMARY"

  move-major-tag:
    if: github.event.action == 'released'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Move major tag
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          major="${TAG%%.*}"
          if [ "$major" = "$TAG" ]; then
            echo "::error::Release tag '$TAG' is not vX.Y.Z"
            exit 1
          fi
          git tag -f "$major" "$TAG"
          git push -f origin "refs/tags/$major"
          echo "Moved $major -> $TAG ($(git rev-parse --short "$TAG"))"
