name: Test

on:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check action.yml and renderer
        run: |
          python3 -c "import yaml; yaml.safe_load(open('action.yml'))"
          python3 -m py_compile src/render.py

  # Runs this branch's action on pushes to its own PR. Force-push a rebased
  # branch to exercise the full path; end-to-end scenarios live in antidiffamine-test.
  dogfood:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: ad
        uses: ./
        with:
          comment: false
          html_enabled: false
      - name: Show outputs
        run: |
          echo "skipped=${{ steps.ad.outputs.skipped }}"
          echo "bases_match=${{ steps.ad.outputs.bases_match }}"
          echo "had_conflicts=${{ steps.ad.outputs.had_conflicts }}"
          echo "rebase_failed=${{ steps.ad.outputs.rebase_failed }}"
